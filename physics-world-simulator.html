<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics World Simulator</title>
<style>
  :root{
    --panel-bg: rgba(20,22,30,.72);
    --panel-border: rgba(255,255,255,.12);
    --text: #eef1f8;
    --accent: #6fe3ff;
    --danger: #ff5d5d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0c14;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);}
  canvas{display:block;touch-action:none;cursor:crosshair;}
  #ui{
    position:fixed;top:12px;left:12px;z-index:10;
    background:var(--panel-bg);border:1px solid var(--panel-border);
    backdrop-filter:blur(10px);border-radius:14px;padding:12px 14px;
    width:230px;box-shadow:0 8px 30px rgba(0,0,0,.4);
    font-size:13px;
  }
  #ui h1{font-size:14px;margin:0 0 8px;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
  .row label{opacity:.85}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  button{
    cursor:pointer;border:1px solid var(--panel-border);background:rgba(255,255,255,.06);
    color:var(--text);border-radius:8px;padding:7px 8px;font-size:12px;transition:.15s;
  }
  button:hover{background:rgba(255,255,255,.14)}
  button.active{background:var(--accent);color:#04222a;border-color:var(--accent);font-weight:600}
  button.wide{grid-column:1/-1}
  #bombBtn{background:linear-gradient(135deg,#4a1010,#2a0808);border-color:#7a2020;color:#ffb3b3}
  #bombBtn.active{background:var(--danger);color:#2a0000;border-color:#ff8080;}
  input[type=range]{width:110px;accent-color:var(--accent)}
  #hint{position:fixed;bottom:10px;left:12px;z-index:10;font-size:11px;opacity:.55;max-width:280px}
  .toggle{position:relative;width:38px;height:20px;background:rgba(255,255,255,.15);border-radius:20px;cursor:pointer;flex:none}
  .toggle .dot{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.15s}
  .toggle.on{background:var(--accent)}
  .toggle.on .dot{left:20px;background:#04222a}
  #count{position:fixed;top:12px;right:12px;z-index:10;font-size:12px;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <h1>⚛️ Physics World</h1>
  <div class="row"><label>Gravity</label><div class="toggle on" id="gravToggle"><div class="dot"></div></div></div>
  <div class="row"><label>Gravity ↕</label><input id="gravFlip" type="range" min="-1" max="1" step="2" value="1" style="display:none"></div>
  <div class="row"><label>Strength</label><input id="gravSlider" type="range" min="0" max="2000" value="900"></div>
  <div class="row"><label>Bounce</label><input id="bounceSlider" type="range" min="20" max="100" value="78"></div>
  <div class="row"><label>Sound</label><div class="toggle on" id="soundToggle"><div class="dot"></div></div></div>
  <div class="btns">
    <button id="addCircle">● Circle</button>
    <button id="addSquare">■ Square</button>
    <button id="addTri">▲ Triangle</button>
    <button id="burst">✨ Burst</button>
    <button id="bombBtn" class="wide">💣 Arm Bomb</button>
    <button id="clearBtn" class="wide">🗑 Clear</button>
  </div>
</div>
<div id="count">0 objects</div>
<div id="hint">Click empty space to drop a shape · Drag shapes to fling them · Arm the bomb, then click anywhere to detonate</div>

<script>
(() => {
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

// ---------- Audio ----------
let actx = null, soundOn = true;
function ensureAudio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); }
const SCALE = [261.6,293.7,329.6,349.2,392.0,440.0,493.9,523.3,587.3,659.3,698.5,784.0]; // C major-ish
function playNote(freq, vel){
  if(!soundOn || !actx) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  const v = Math.min(1, vel/900) * 0.35 + 0.05;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(v, t+0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.5);
  osc.connect(gain).connect(actx.destination);
  osc.start(t); osc.stop(t+0.5);
}
function playBoom(){
  if(!soundOn || !actx) return;
  const t = actx.currentTime;
  const bufSize = actx.sampleRate * 0.6;
  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/bufSize, 2);
  const noise = actx.createBufferSource(); noise.buffer = buf;
  const filt = actx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.setValueAtTime(1200,t); filt.frequency.exponentialRampToValueAtTime(60,t+0.5);
  const gain = actx.createGain(); gain.gain.setValueAtTime(0.9,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.6);
  noise.connect(filt).connect(gain).connect(actx.destination);
  noise.start(t);
  const osc = actx.createOscillator(); osc.type='sine';
  const og = actx.createGain();
  osc.frequency.setValueAtTime(120,t); osc.frequency.exponentialRampToValueAtTime(30,t+0.4);
  og.gain.setValueAtTime(0.8,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.5);
  osc.connect(og).connect(actx.destination); osc.start(t); osc.stop(t+0.5);
}

// ---------- World ----------
let gravityOn = true, gravity = 900, restitution = 0.78;
const colors = ['#6fe3ff','#ff9f6f','#9fff6f','#ff6fd8','#ffe36f','#a06fff','#6fffb0'];
let objects = [];
let idSeed = 0;

function makeShape(x,y,type,r){
  r = r || 18 + Math.random()*22;
  return {
    id: idSeed++, x, y, vx:(Math.random()-0.5)*200, vy:(Math.random()-0.5)*100,
    r, type: type || (['circle','square','triangle'][Math.floor(Math.random()*3)]),
    color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*Math.PI*2, vrot:(Math.random()-0.5)*4,
    mass: r*r,
    note: SCALE[Math.floor((1 - Math.min(y/H,1)) * (SCALE.length-1))] // higher on screen = higher pitch
  };
}
for(let i=0;i<8;i++) objects.push(makeShape(Math.random()*W, Math.random()*H*0.5));

// ---------- Interaction ----------
let dragging = null, dragOffX=0, dragOffY=0, lastPX=0, lastPY=0, ptTrail=[];
let bombArmed = false;
let explosions = []; // {x,y,t}

function hitTest(px,py){
  for(let i=objects.length-1;i>=0;i--){
    const o = objects[i];
    if(Math.hypot(px-o.x, py-o.y) <= o.r) return o;
  }
  return null;
}

function pointerDown(px,py){
  ensureAudio();
  if(bombArmed){
    detonate(px,py);
    return;
  }
  const hit = hitTest(px,py);
  if(hit){
    dragging = hit; dragging.dragging = true;
    dragOffX = px-hit.x; dragOffY = py-hit.y;
    ptTrail = [{x:px,y:py,t:performance.now()}];
  } else {
    objects.push(makeShape(px,py));
  }
}
function pointerMove(px,py){
  lastPX=px; lastPY=py;
  if(dragging){
    dragging.x = px-dragOffX; dragging.y = py-dragOffY;
    ptTrail.push({x:px,y:py,t:performance.now()});
    if(ptTrail.length>6) ptTrail.shift();
  }
}
function pointerUp(){
  if(dragging){
    if(ptTrail.length>=2){
      const a = ptTrail[0], b = ptTrail[ptTrail.length-1];
      const dt = Math.max(16,(b.t-a.t))/1000;
      dragging.vx = (b.x-a.x)/dt; dragging.vy = (b.y-a.y)/dt;
    }
    dragging.dragging = false;
    dragging = null;
  }
}
canvas.addEventListener('mousedown', e=>pointerDown(e.clientX,e.clientY));
canvas.addEventListener('mousemove', e=>pointerMove(e.clientX,e.clientY));
addEventListener('mouseup', pointerUp);
canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; pointerDown(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ const t=e.touches[0]; pointerMove(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
addEventListener('touchend', pointerUp);

function detonate(x,y){
  ensureAudio();
  playBoom();
  explosions.push({x,y,t:0});
  const RADIUS = 340, FORCE = 26000;
  for(const o of objects){
    const dx = o.x-x, dy = o.y-y;
    const dist = Math.max(20, Math.hypot(dx,dy));
    if(dist < RADIUS){
      const power = (1 - dist/RADIUS) * FORCE / (o.mass*0.02+1);
      o.vx += (dx/dist)*power;
      o.vy += (dy/dist)*power;
      o.vrot += (Math.random()-0.5)*10;
    }
  }
  bombArmed = false;
  bombBtn.classList.remove('active');
  canvas.style.cursor = 'crosshair';
}

// ---------- Simulation ----------
let last = performance.now();
function step(now){
  let dt = (now-last)/1000; last = now;
  dt = Math.min(dt, 0.033);

  for(const o of objects){
    if(o === dragging) continue;
    if(gravityOn) o.vy += gravity*dt;
    o.vx *= 0.999; o.vy *= 0.999;
    o.x += o.vx*dt; o.y += o.vy*dt;
    o.rot += o.vrot*dt;

    let bounced = false, speed=0;
    if(o.x - o.r < 0){ o.x=o.r; o.vx=-o.vx*restitution; bounced=true; speed=Math.abs(o.vx); }
    if(o.x + o.r > W){ o.x=W-o.r; o.vx=-o.vx*restitution; bounced=true; speed=Math.abs(o.vx); }
    if(o.y - o.r < 0){ o.y=o.r; o.vy=-o.vy*restitution; bounced=true; speed=Math.abs(o.vy); }
    if(o.y + o.r > H){
      o.y=H-o.r; o.vy=-o.vy*restitution; o.vrot*=0.7;
      bounced=true; speed=Math.abs(o.vy);
    }
    if(bounced && speed>40) playNote(o.note, speed);
  }

  // simple pairwise collision (capped for perf)
  const n = objects.length;
  if(n <= 80){
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const a=objects[i], b=objects[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist=Math.hypot(dx,dy);
        const minD=a.r+b.r;
        if(dist>0 && dist<minD){
          const nx=dx/dist, ny=dy/dist;
          const overlap=(minD-dist)/2;
          if(a!==dragging){ a.x-=nx*overlap; a.y-=ny*overlap; }
          if(b!==dragging){ b.x+=nx*overlap; b.y+=ny*overlap; }
          const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
          const rel = rvx*nx+rvy*ny;
          if(rel<0){
            const imp = -(1+restitution)*rel / (1/a.mass+1/b.mass);
            const ix=imp*nx, iy=imp*ny;
            a.vx -= ix/a.mass; a.vy -= iy/a.mass;
            b.vx += ix/b.mass; b.vy += iy/b.mass;
            const relSpeed = Math.abs(rel);
            if(relSpeed>60) playNote((a.note+b.note)/2, relSpeed);
          }
        }
      }
    }
  }

  draw();
  countEl.textContent = objects.length + ' objects';
  requestAnimationFrame(step);
}

function drawShape(o){
  ctx.save();
  ctx.translate(o.x,o.y);
  ctx.rotate(o.rot);
  ctx.fillStyle = o.color;
  ctx.shadowColor = o.color;
  ctx.shadowBlur = o.dragging ? 22 : 8;
  ctx.beginPath();
  if(o.type==='circle'){
    ctx.arc(0,0,o.r,0,Math.PI*2);
  } else if(o.type==='square'){
    ctx.rect(-o.r,-o.r,o.r*2,o.r*2);
  } else {
    ctx.moveTo(0,-o.r); ctx.lineTo(o.r*0.87,o.r*0.6); ctx.lineTo(-o.r*0.87,o.r*0.6); ctx.closePath();
  }
  ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // subtle grid bg
  ctx.fillStyle = '#0a0c14';
  ctx.fillRect(0,0,W,H);

  for(const o of objects) drawShape(o);

  // explosions
  for(let i=explosions.length-1;i>=0;i--){
    const ex = explosions[i];
    ex.t += 1/60;
    const p = ex.t/0.5;
    if(p>=1){ explosions.splice(i,1); continue; }
    ctx.beginPath();
    ctx.arc(ex.x,ex.y, p*340, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,${140-p*100},60,${1-p})`;
    ctx.lineWidth = 10*(1-p);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ex.x,ex.y, p*160, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,200,80,${(1-p)*0.5})`;
    ctx.fill();
  }
}

// ---------- UI wiring ----------
const gravToggle = document.getElementById('gravToggle');
gravToggle.onclick = () => { gravityOn = !gravityOn; gravToggle.classList.toggle('on', gravityOn); };
const soundToggle = document.getElementById('soundToggle');
soundToggle.onclick = () => { soundOn = !soundOn; soundToggle.classList.toggle('on', soundOn); ensureAudio(); };
document.getElementById('gravSlider').oninput = e => gravity = +e.target.value;
document.getElementById('bounceSlider').oninput = e => restitution = +e.target.value/100;
document.getElementById('addCircle').onclick = () => objects.push(makeShape(W/2+(Math.random()-.5)*100, 40, 'circle'));
document.getElementById('addSquare').onclick = () => objects.push(makeShape(W/2+(Math.random()-.5)*100, 40, 'square'));
document.getElementById('addTri').onclick = () => objects.push(makeShape(W/2+(Math.random()-.5)*100, 40, 'triangle'));
document.getElementById('burst').onclick = () => { for(let i=0;i<10;i++) objects.push(makeShape(W/2+(Math.random()-.5)*200, H*0.2)); };
document.getElementById('clearBtn').onclick = () => { objects = []; };
const bombBtn = document.getElementById('bombBtn');
bombBtn.onclick = () => {
  bombArmed = !bombArmed;
  bombBtn.classList.toggle('active', bombArmed);
  canvas.style.cursor = bombArmed ? "url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22><text y=%2224%22 font-size=%2224%22>💣</text></svg>') 16 16, crosshair" : 'crosshair';
};
const countEl = document.getElementById('count');

requestAnimationFrame(step);
})();
</script>
</body>
</html>
